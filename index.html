<script type="module">
/* A config do Firebase fica em firebase-config.js (usada aqui e no /ADM).
   Sem config: funciona em duas abas do MESMO navegador (para testar). */
let firebaseConfig = null;
try { ({ firebaseConfig } = await import("./firebase-config.js")); } catch (e) {}

const sala = new URLSearchParams(location.search).get("sala") || "principal";
let api;
if (firebaseConfig) {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getDatabase, ref, set, update, onValue, onDisconnect } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const db = getDatabase(initializeApp(firebaseConfig));
  const r = p => ref(db, "nexus/" + sala + (p ? "/" + p : ""));
  api = {
    ouvir: cb => onValue(r(), s => cb(s.val() || {})),
    set: (p, v) => set(r(p), v),
    aoSair: p => { const o = onDisconnect(r(p)); o.cancel().then(() => o.remove()); },   // fechou a aba/caiu → apaga do firebase
    naoSair: p => onDisconnect(r(p)).cancel(),
  };
} else {
  const K = "nexus_" + sala, bc = new BroadcastChannel(K);
  const ler = () => JSON.parse(localStorage.getItem(K) || "{}");
  const cbs = [];
  bc.onmessage = () => cbs.forEach(cb => cb(ler()));
  addEventListener("storage", e => { if (e.key === K) cbs.forEach(cb => cb(ler())); });
  api = {
    ouvir: cb => { cbs.push(cb); cb(ler()); },
    set: (p, v) => { const d = ler(); if (v === null) delete d[p]; else d[p] = v; localStorage.setItem(K, JSON.stringify(d)); bc.postMessage(1); cbs.forEach(cb => cb(d)); },
    aoSair: () => {}, naoSair: () => {},
  };
}
window.NX = api;
window.dispatchEvent(new Event("nx-pronto"));
</script>

  nexusAtira: false,       // nexus atira em quem estiver atacando ele

     tanque    — aguenta muito, puxa a atenção (provoca) e leva menos dano. FORTE x assassino · FRACO x atirador, mago
     atirador  — tiro de longe.                                            FORTE x tanque    · FRACO x assassino

     mago      — bola de energia que EXPLODE em área.                       FORTE x tanque, suporte · FRACO x assassino
     suporte   — CURA os aliados e ataca fraquinho.                         FORTE x mago     · FRACO x assassino      */
  forte: 1.6,              // multiplicador de dano contra quem você é forte
  fraco: 0.6,              // multiplicador de dano contra quem você é fraco
  // 8 por jogador. foto: URL (vazio = placeholder). libera: segundo em que aparece na loja
  personagens: {
    1: [
      { nome:"Alanzoka", foto:"sprites/00-alanzoka.png", pixel:true, cor:"#7b86d9", preco:1, libera:0, classe:"atirador", vida:120, dano:12, vel:1.0, alcance:5.0, cad:1.0 },

      { nome:"Emily Vick", foto:"sprites/02-emily-vick.png", pixel:true, cor:"#ff5fa8", preco:20, libera:30, classe:"assassino", vida:150, dano:28, vel:1.4, alcance:1.1, cad:0.8 },
      { nome:"JazzGhost", foto:"sprites/03-jazzghost.png", pixel:true, cor:"#c08a50", preco:50, libera:60, classe:"atirador", vida:200, dano:24, vel:0.9, alcance:5.5, cad:1.1 },
      { nome:"Guima", foto:"sprites/04-guima.png", pixel:true, cor:"#ffc93c", preco:100, libera:100, classe:"suporte", vida:180, dano:10, vel:0.8, alcance:4.0, cad:1.2 },
      { nome:"Giuliana Mafra", foto:"sprites/05-giuliana-mafra.png", pixel:true, cor:"#d08a50", preco:250, libera:150, classe:"mago", vida:260, dano:34, vel:0.7, alcance:4.5, cad:1.6 },
      { nome:"Vinnicius13", foto:"sprites/06-vinnicius13.png", pixel:true, cor:"#e8323c", preco:500, libera:210, classe:"assassino", vida:340, dano:60, vel:1.5, alcance:1.2, cad:0.8 },
      { nome:"Gato Galáctico", foto:"sprites/07-gato-galactico.png", pixel:true, cor:"#4ade6a", preco:1000, libera:270, classe:"tanque", vida:1600, dano:40, vel:0.6, alcance:1.4, cad:1.1 },
    ],
    2: [
      { nome:"SaikoJoga", foto:"sprites/08-saikojoga.png", pixel:true, cor:"#a855f7", preco:1, libera:0, classe:"atirador", vida:120, dano:12, vel:1.0, alcance:5.0, cad:1.0 },
      { nome:"T3ddy", foto:"sprites/09-t3ddy.png", pixel:true, cor:"#c98a4b", preco:5, libera:0, classe:"tanque", vida:380, dano:10, vel:0.8, alcance:1.3, cad:1.0 },
      { nome:"Felipe Neto", foto:"sprites/10-felipe-neto.png", pixel:true, cor:"#ff7a1a", preco:20, libera:30, classe:"assassino", vida:150, dano:28, vel:1.4, alcance:1.1, cad:0.8 },
      { nome:"Problems", foto:"sprites/11-problems.png", pixel:true, cor:"#22d3ee", preco:50, libera:60, classe:"atirador", vida:200, dano:24, vel:0.9, alcance:5.5, cad:1.1 },
      { nome:"Mike", foto:"sprites/12-mike.png", pixel:true, cor:"#22c55e", preco:100, libera:100, classe:"suporte", vida:180, dano:10, vel:0.8, alcance:4.0, cad:1.2 },
      { nome:"Jujubinha", foto:"sprites/13-jujubinha.png", pixel:true, cor:"#ff7ac8", preco:250, libera:150, classe:"mago", vida:260, dano:34, vel:0.7, alcance:4.5, cad:1.6 },
      { nome:"Pac", foto:"sprites/14-pac.png", pixel:true, cor:"#3b82f6", preco:500, libera:210, classe:"assassino", vida:340, dano:60, vel:1.5, alcance:1.2, cad:0.8 },

     tipo "msg" = só um aviso no texto da câmera                      */
  // partida de ~8 min: começo de boa, J2 fica sem dinheiro pros fortes e o J1 vence perto de 8:00

    {t:3,j:1,p:0},

    {t:40,j:1,p:2},
    {t:45,j:2,p:2},
    {t:65,j:1,p:3},
    {t:70,j:2,p:3},
    {t:105,j:1,p:4},

    {t:165,j:2,p:5},
    {t:215,j:1,p:6},

    {t:275,j:1,p:7},
    {t:280,j:2,tipo:"msg",texto:"tenta juntar pro mais forte"},

/* Config salva pelo painel /ADM substitui a de cima */
let configAplicada = "";
function aplicarConfig(c){
  if (!c || c.versao !== CONFIG.versao) return;     // config salva de uma versão antiga: ignora
  const s = JSON.stringify(c); if (s === configAplicada) return; configAplicada = s;
  for (const k of ["nexusVida","cooldown","cooldownMorte","ritmo","autoRecolocar","avisoRecolocar","dinheiroInicial","renda","rendaCresce","lojaFundo","maxEmCampo","maxFinal","acelerar","vencedor","duracao","forte","fraco","nexusAtira","focarNovo"]) if (c[k] !== undefined) CONFIG[k] = c[k];
  if (c.personagens) [1,2].forEach(j => { if (c.personagens[j]) CONFIG.personagens[j] = c.personagens[j]; });
  if (c.roteiro) CONFIG.roteiro = [...c.roteiro].sort((a,b) => a.t - b.t);
}

/* ===== estado de rede ===== */
let EU = 0, dados = {}, inicio = null;
const jog = { 1:{nome:"Jogador 1",foto:""}, 2:{nome:"Jogador 2",foto:""} };
const lobby = document.getElementById("lobby");

window.addEventListener("nx-pronto", () => {
  const ver = +new URLSearchParams(location.search).get("ver");
  if (ver === 1 || ver === 2) { EU = ver; window.ESPECTADOR = 1; }
  let salvo = 0; try { salvo = +sessionStorage.getItem("nexus_eu") || 0; } catch(e){}
  let primeira = true;
  NX.ouvir(d => {
    if (primeira) { primeira = false;
      if (salvo && d["j"+salvo]) { EU = salvo; NX.aoSair("j"+EU); } }
    dados = d;
    if (d.config) aplicarConfig(d.config);
    [1,2].forEach(j => { if (d["j"+j]) jog[j] = d["j"+j]; });
    if (fim && !window.ESPECTADOR) {               // acabou: fica parado na tela final até clicar em "voltar ao lobby"
      if (!(d.inicio && d.inicio !== inicio && !d.fim && d.j1 && d.j2)) return;   // só sai se o ADM reiniciar a partida
      fim = 0; loop.fimT = 0;
    }
    const ini = d.j1 && d.j2 ? (d.inicio || null) : null;   // sem os 2 jogadores, não roda
    if (ini !== inicio) { inicio = ini; novaPartida(); }
    if (window.ESPECTADOR) { const on = !!d.inicio; lobby.style.display = on ? "none" : "flex";
      form.style.display = "none"; espera.style.display = "flex"; slots.innerHTML = "";
      btnPronto.style.display = "none"; msgLobby.textContent = `Visão de teste do Jogador ${EU} — aguardando o ADM iniciar`; return; }
    atualizaEspera();
  });
});
/* ===== tela cheia (tira a barra do Chrome/Safari) ===== */
function telaCheia(){
  const el = document.documentElement;
  try {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      (el.requestFullscreen ? el.requestFullscreen({ navigationUI: "hide" }) : el.webkitRequestFullscreen && el.webkitRequestFullscreen())?.catch?.(() => {});
      screen.orientation?.lock?.("landscape").catch(() => {});
    }
  } catch (e) {}
  setTimeout(() => window.scrollTo(0, 1), 50);   // truque pro Safari esconder a barra
}
const ehCelular = matchMedia("(pointer: coarse)").matches;
btnCheia.onclick = e => { e.stopPropagation(); telaCheia(); };

// foto automática: inicial do nome (ou J1/J2) num quadrado pixel da cor do time

let fotoAuto = true;

function atualizaEspera(){

  const slot = j => {

    if (!d) return `<div class="slot px s${j}"><div class="tag">JOGADOR ${j}</div><div class="ft vazio">?</div>

  atualizaEspera.tinha = !!(EU && J(EU));
}

/* ===== efeitos do lobby (folhas e brilhos em pixel por cima da imagem) ===== */
(() => {
  const c = document.getElementById("lobbyFundo"), g = c.getContext("2d");
  const fol = Array.from({length:40}, () => ({ x:Math.random(), y:Math.random(), v:0.03+Math.random()*0.05, f:Math.random()*7, c:["#7ee05a","#3fa83a","#c6ff9e","#ffe14d"][Math.floor(Math.random()*4)] }));
  const nuv = Array.from({length:5}, (_, i) => ({ x:Math.random(), y:0.05+i*0.07, v:0.004+Math.random()*0.006 }));
  function quadro(ms){
    if (lobby.style.display === "none") return requestAnimationFrame(quadro);
    const t = ms/1000, w = c.width = c.clientWidth, h = c.height = c.clientHeight, P = Math.max(3, Math.round(w/400));
    g.clearRect(0,0,w,h);
    for (const n of nuv) { n.x += n.v/60; if (n.x > 1.2) n.x = -0.2; const x = Math.round(n.x*w/P)*P, y = Math.round(n.y*h/P)*P;
      g.fillStyle = "rgba(255,255,255,.85)"; g.fillRect(x, y, P*16, P*3); g.fillRect(x+P*3, y-P*3, P*9, P*3); g.fillRect(x+P*6, y-P*5, P*4, P*2); }
    for (const f of fol) { f.y += f.v/60; if (f.y > 1.05) { f.y = -0.05; f.x = Math.random(); }
      const x = Math.round((f.x*w + Math.sin(t*1.4+f.f)*30)/P)*P, y = Math.round(f.y*h/P)*P;
      g.fillStyle = f.c; g.fillRect(x, y, P*2, P); g.fillRect(x+P, y+P, P, P); }
    requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);
})();

/* ===== mundo: visão lateral (plataforma) =====
   x = posição na pista (0 = nexus do J1, PISTA = nexus do J2)
   y = profundidade pequena (só pra não ficar todo mundo em fila)  */
const PISTA = 22;
const NEXUS = { 1:{ x:0.2, y:0 }, 2:{ x:PISTA-0.2, y:0 } };
const nascX = j => j === 1 ? 1.5 : PISTA - 1.5;

/* ===== MARÉ DA BATALHA (roteiro): a frente vai e volta entre os nexus =====
   empurrao(t) = +1 → time vencedor em cima do nexus do perdedor; -1 → perdedor em cima do nexus do vencedor */
const PERIODO = 110;     // segundos de um vai-e-volta completo
function empurrao(t){
  const D = CONFIG.duracao, fimPush = Math.min(50, D*0.12);
  if (t >= D - fimPush) return Math.min(1, 0.4 + (t - (D - fimPush)) / fimPush * 1.2);   // final: vencedor empurra até o fim
  return Math.sin(2*Math.PI * t / PERIODO) * Math.min(1, 0.6 + t / D);                  // vai e volta, cada vez mais forte
}
function frenteX(t){                   // posição da frente na pista (0 = nexus J1, PISTA = nexus J2)
  const meio = PISTA/2, amp = meio - 2.2, e = empurrao(t), lado = CONFIG.vencedor === 2 ? -1 : 1;
  return meio + e * amp * lado;
}
// quanto do dano de cada nexus já "deveria" ter acontecido (só cai quando o inimigo está em cima dele)
let PRESS = null;
function calcPressao(){
  const D = CONFIG.duracao, passo = 0.5, ac = { v:[0], p:[0] };
  for (let t = passo; t <= D + 0.01; t += passo) { const e = empurrao(t);
    ac.p.push(ac.p.at(-1) + Math.max(0, e - 0.35) * passo); ac.v.push(ac.v.at(-1) + Math.max(0, -e - 0.35) * passo); }
  PRESS = { passo, p: ac.p.map(x => x / ac.p.at(-1)), v: ac.v.map(x => x / (ac.v.at(-1) || 1)) };
  // momentos em que cada lado começa a avançar (pra comprar reforço logo antes)
  PRESS.viradas = [];
  let ant = empurrao(0);
  for (let t = 1; t <= D; t += 1) { const e = empurrao(t);
    if (ant < 0.3 && e >= 0.3) PRESS.viradas.push({ t, lado: CONFIG.vencedor || 1 });
    if (ant > -0.3 && e <= -0.3) PRESS.viradas.push({ t, lado: CONFIG.vencedor === 2 ? 1 : 2 });
    ant = e; }
}
let idxV = 0;
// compra o melhor personagem que dá pra comprar agora (é o "reforço" que faz o time avançar)
function comprarReforco(j){
  const L = CONFIG.personagens[j]; let melhor = -1;
  L.forEach((P, i) => { if (simT >= P.libera && grana[j] >= (P.preco||0) && (voltaEm[j][i]||0) <= simT && !unid.some(u => u.j===j && u.p===i && u.vida>0) && (melhor < 0 || (P.preco||0) > (L[melhor].preco||0))) melhor = i; });
  if (melhor >= 0) { adicionar({ t:simT, j, p:melhor, reforco:true }); msgs[j] = { texto: "reforço! seu time vai avançar", ate: simT + 3 }; }
}
const pressao = (qual, t) => { if (!PRESS) calcPressao(); const i = Math.min(PRESS[qual].length - 1, Math.max(0, Math.floor(t / PRESS.passo))); return PRESS[qual][i]; };

/* ===== simulação determinística (igual nos dois PCs) ===== */
const DT = 1/30;
let simT, unid, tiros, nx, idxR, msgs, fim, prox_id, cdFim, voltaEm, fila, agenda, grana;
function novaPartida(){
  try { FX.limpar(); } catch (e) {}
  PRESS = null; idxV = 0;
  simT = 0; unid = []; tiros = []; idxR = 0; msgs = {1:null,2:null}; fim = 0; prox_id = 1;
  nx = { 1:{vida:CONFIG.nexusVida, cd:0, hit:0}, 2:{vida:CONFIG.nexusVida, cd:0, hit:0} };
  cdFim = {1:0,2:0}; voltaEm = {1:{},2:{}}; fila = []; agenda = [];
  grana = { 1:CONFIG.dinheiroInicial, 2:CONFIG.dinheiroInicial };
}
novaPartida();

const ENTRADA = 0.55;   // tempo da carta voando até o campo
function adicionar(e){
  const P = CONFIG.personagens[e.j][e.p], preco = P.preco || 0;
  if ((voltaEm[e.j][e.p] || 0) > simT || simT < P.libera || grana[e.j] < preco) { fila.push(e); return; }
  if (unid.some(u => u.j === e.j && u.p === e.p && u.vida > 0)) return;   // já está em campo
  if (unid.filter(u => u.j === e.j && u.vida > 0).length >= ((simT >= CONFIG.duracao - 90 ? CONFIG.maxFinal : CONFIG.maxEmCampo) || 99)) { if (!e.reforco) fila.push(e); return; }   // campo cheio: espera alguém sair
  agenda = agenda.filter(a => !(a.j === e.j && a.p === e.p));
  grana[e.j] -= preco;
  const prof = ((prox_id * 0.618) % 1 - 0.5) * 3;
  const u = { id: prox_id++, j:e.j, p:e.p, x:nascX(e.j), y:prof, vida:P.vida, max:P.vida, cd:0.5, nasceu:simT, alvo:null, forcado:null };
  unid.push(u); cdFim[e.j] = simT + CONFIG.cooldown; FX.compra(u, preco);
  if (CONFIG.focarNovo) {
    const N = NEXUS[e.j];
    for (const o of unid) if (o.j !== e.j && o.vida > 0 && Math.abs(o.x - N.x) < 4.5) o.forcado = u;
  }
}
const dist = (a,b) => Math.hypot(a.x-b.x, (a.y-b.y)*0.5);
const ativo = u => u.vida > 0 && simT - u.nasceu >= ENTRADA;

function passo(){
  if (fim) return;                     // acabou: o jogo para (ninguém mais nasce/ataca)
  simT += DT;
  // renda: vai aumentando com o tempo
  for (const j of [1,2]) grana[j] += CONFIG.renda * (1 + simT / CONFIG.rendaCresce) * DT;
  for (const e of fila.splice(0)) adicionar(e);
  if (CONFIG.vencedor) { if (!PRESS) calcPressao();
    while (idxV < PRESS.viradas.length && PRESS.viradas[idxV].t - 4 <= simT) { comprarReforco(PRESS.viradas[idxV].lado); idxV++; } }
  for (const e of agenda.filter(a => a.t <= simT)) { agenda.splice(agenda.indexOf(e), 1); adicionar(e); }
  while (idxR < CONFIG.roteiro.length && CONFIG.roteiro[idxR].t <= simT) {
    const e = CONFIG.roteiro[idxR++];
    if (e.tipo === "msg") msgs[e.j] = { texto:e.texto, ate:simT+3 }; else adicionar(e);
  }
  if (fim) return;
  const BT = DT * CONFIG.ritmo;   // tempo de batalha
  for (const u of unid) {
    if (!ativo(u)) continue;
    const P = CONFIG.personagens[u.j][u.p], inim = u.j===1?2:1, cl = P.classe || "atirador";
    u.cdPoder = (u.cdPoder || 0) - BT;
    if (u.forcado && !ativo(u.forcado)) u.forcado = null;
    // SUPORTE: cura o aliado mais machucado por perto
    if (cl === "suporte") {
      let fer = null, menor = 0.92;
      for (const o of unid) if (o.j === u.j && o !== u && ativo(o) && dist(u,o) <= P.alcance) { const f = o.vida/o.max; if (f < menor) { menor = f; fer = o; } }
      if (fer && (u.cd -= BT) <= 0) { u.cd = P.cad; u.atk = simT; u.ax = Math.sign(fer.x - u.x) || 1;
        tiros.push({ x:u.x, y:u.y, alvo:fer, dono:u.j, cura: P.dano*3, v:7, t:0, rast:[], tipo:"cura" }); continue; }
    }
    let alvo = u.forcado, d = alvo ? dist(u, alvo) : 1e9;
    if (!alvo) {
      // provocação: um tanque inimigo perto puxa a atenção
      for (const o of unid) if (o.j !== u.j && ativo(o) && classeDe(o) === "tanque") { const dd = dist(u,o); if (dd < 2.6 && dd < d) { d = dd; alvo = o; } }
      // assassino procura atirador/mago/suporte num raio maior
      if (!alvo && cl === "assassino") for (const o of unid) if (o.j !== u.j && ativo(o) && ["atirador","mago","suporte"].includes(classeDe(o))) { const dd = dist(u,o); if (dd < 7 && dd < d) { d = dd; alvo = o; } }
      if (!alvo) for (const o of unid) if (o.j !== u.j && ativo(o)) { const dd = dist(u,o); if (dd < d - 1e-6) { d = dd; alvo = o; } }
    }
    const aggro = cl === "assassino" ? 7 : Math.max(4.5, P.alcance + 1.5);
    if (!alvo || (d > aggro && !u.forcado)) { alvo = "nexus"; d = Math.abs(u.x - NEXUS[inim].x) - 0.9; }
    u.batendoNexus = alvo === "nexus" && d <= P.alcance;
    const T = alvo === "nexus" ? NEXUS[inim] : alvo;
    // ASSASSINO: salto em cima do alvo
    if (cl === "assassino" && alvo !== "nexus" && d > P.alcance && d < 5.5 && u.cdPoder <= 0) {
      const lado = Math.sign(u.x - T.x) || 1, x0 = u.x, y0 = u.y;
      u.x = T.x + lado*0.8; u.y = T.y; u.cdPoder = 6; u.salto = { t:simT, x0, y0 }; u.cd = 0.15;
      FX.salto(u, x0, y0); continue;
    }
    if (d > P.alcance) {
      const dx = T.x - u.x, dy = (T.y - u.y) * 0.3, m = Math.hypot(dx, dy) || 1;
      u.x += dx/m*P.vel*BT; u.y += dy/m*P.vel*BT*0.4; u.andando = simT; u.vx = Math.sign(dx);
    } else if ((u.cd -= BT) <= 0) {
      u.cd = P.cad; u.atk = simT; u.ax = Math.sign(T.x - u.x) || (u.j===1?1:-1);
      if (cl === "mago") { tiros.push({ x:u.x, y:u.y, alvo, dono:u.j, dano:P.dano, v:4.5, t:0, rast:[], tipo:"magia", atk:u }); FX.muzzle(u); }
      else if (cl === "atirador" || cl === "suporte") { tiros.push({ x:u.x, y:u.y, alvo, dono:u.j, dano:P.dano, v:7, t:0, rast:[], tipo:"tiro", atk:u }); FX.muzzle(u); }
      else { dano(alvo, P.dano, inim, u); FX.golpe(u, T, cl); }    // corpo a corpo (tanque/assassino)
    }
    // separação: um não fica em cima do outro
    for (const o of unid) if (o !== u && ativo(o)) { const dd = dist(u,o), lim = o.j === u.j ? 1.5 : 1.1; if (dd < lim && dd > 0) { const f = (lim-dd)*0.09; u.x += (u.x-o.x)/dd*f*(o.j === u.j ? 1 : 0.6); u.y += ((u.y-o.y)/dd || (u.id%2?1:-1))*f*2.2; } }
    u.y = Math.max(-1.6, Math.min(1.6, u.y));
    if (CONFIG.vencedor) {     // ninguém passa da linha de frente (com folga pra trocar golpes)
      const fx = frenteX(simT), folga = 1.4;
      const fora = u.j === 1 ? u.x - (fx + folga) : (fx - folga) - u.x;
      if (fora > 0) {   // a frente inimiga passou por cima: recua apanhando
        u.x += (u.j === 1 ? -1 : 1) * Math.min(fora, P.vel*BT*1.2);
        u.vida -= u.max * 0.12 * BT;          // perde vida recuando (sem piscar branco o tempo todo)
      }
    }
    u.x = Math.max(1, Math.min(PISTA-1, u.x));
  }
  if (CONFIG.nexusAtira) for (const j of [1,2]) {
    const N = NEXUS[j]; nx[j].cd -= BT;
    let alvo = null, bd = 3.6;
    for (const u of unid) if (u.j !== j && ativo(u)) { const dd = Math.abs(u.x - N.x) - (u.batendoNexus ? 5 : 0); if (dd < bd) { bd = dd; alvo = u; } }
    if (alvo && nx[j].cd <= 0) { nx[j].cd = 1.0; tiros.push({ x:N.x, y:N.y, alvo, dono:j, dano:55, v:9, nexus:1, t:0, rast:[] }); nx[j].tiro = simT; }
  }
  for (const t of tiros) {
    t.t += BT;
    const T = t.alvo === "nexus" ? NEXUS[t.dono===1?2:1] : t.alvo;
    const d = Math.hypot(T.x - t.x, T.y - t.y);
    if (d < 0.25 || (t.alvo !== "nexus" && t.alvo.vida <= 0)) {
      if (d < 0.25) {
        if (t.tipo === "cura") { t.alvo.vida = Math.min(t.alvo.max, t.alvo.vida + t.cura); FX.cura(t.alvo, t.cura); }
        else if (t.tipo === "magia") {    // explosão em área
          FX.explosao(T, t.dono);
          if (t.alvo === "nexus") dano("nexus", t.dano, t.dono===1?2:1, t.atk);
          for (const o of unid) if (o.j !== t.dono && ativo(o) && dist(o, T) < 1.5) dano(o, t.dano, 0, t.atk);
        } else dano(t.alvo, t.dano, t.dono===1?2:1, t.atk);
      }
      t.morto = 1; }
    else { t.rast.push({x:t.x, y:t.y}); if (t.rast.length > 7) t.rast.shift(); t.x += (T.x-t.x)/d*t.v*BT; t.y += (T.y-t.y)/d*t.v*BT; }
  }

    const x = d.x + (R.x+R.w/2 - d.x)*e, y = d.y + (R.y+R.h-PX*8 - d.y)*e - Math.sin(f*Math.PI)*(PX*30 + m.s*PX*14);
    ctx.globalAlpha = 1 - Math.max(0, f-0.8)*5;
    const fr = MOEDA[Math.floor((t*10 + m.s*3)) % 3];
    desenharSprite(sprite("moeda"+fr.join(), fr, PAL_MOEDA), x, y, PX, true); }
  ctx.globalAlpha = 1;
  for (const v of FX.voos) {
    const P = CONFIG.personagens[v.j][v.p], im = img(P.foto), R = cartaRect(v.p), alvo = proj(v.x, v.y);
    const f = Math.min(1, v.t/ENTRADA), e = 1 - Math.pow(1-f, 3);
    const x = R.x+R.w/2 + (alvo.x - (R.x+R.w/2))*e, y = R.y+R.h/2 + (alvo.y - 200*SC - (R.y+R.h/2))*e - Math.sin(f*Math.PI)*PX*40;
    const tw = snap(R.w*(1 - e*0.25)), th = snap(tw*1.2);
    for (let i=1;i<5;i++){ ctx.globalAlpha = 0.5 - i*0.1; ctx.fillStyle = P.cor || corDe(v.j);
      ctx.fillRect(snap(x - (alvo.x - R.x)*0.04*i), snap(y + PX*6*i), PX*3, PX*3); }
    ctx.globalAlpha = 1;
    pbox(x - tw/2, y - th/2, tw, th, P.cor || corDe(v.j), "#fff", "rgba(255,255,255,.4)");
    if (im) { const s2 = Math.min((tw-PX*4)/im.naturalWidth, (th-PX*4)/im.naturalHeight); ctx.imageSmoothingEnabled = false;
      ctx.drawImage(im, Math.round(x - im.naturalWidth*s2/2), Math.round(y - im.naturalHeight*s2/2), Math.round(im.naturalWidth*s2), Math.round(im.naturalHeight*s2)); }
  }
}

/* ===== textos das câmeras (pequenos, sem fundo) ===== */
/* ===== textos das câmeras: cada aviso fica fixo até a contagem dele acabar ===== */
const seg = v => Math.max(0, Math.ceil(v - 1e-6));
function candidatosCam(j){
  const L = [], venc = CONFIG.vencedor, falta = CONFIG.duracao - simT;
  if (venc && falta <= 15) L.push({ chave:"final", ate: CONFIG.duracao, prio: 9,
    txt: () => j === venc ? `🏆 VOCÊ VAI VENCER EM ${seg(CONFIG.duracao - simT)}s!` : `💀 SEU NEXUS CAI EM ${seg(CONFIG.duracao - simT)}s!` });
  if (msgs[j] && simT < msgs[j].ate) { const m = msgs[j]; L.push({ chave:"msg"+m.ate, ate: m.ate, prio: 5, txt: () => "💬 " + m.texto }); }
  const e = proxDo(j);
  if (e) {
    if (e.tipo === "msg") L.push({ chave:"rm"+e.t, ate: e.t, prio: 3, txt: () => `em ${seg(e.t - simT)}s: ${e.texto}` });
    else { const P = CONFIG.personagens[j][e.p];
      if (e.auto && simT < e.avisoDe) L.push({ chave:"morto"+e.p+e.avisoDe, ate: e.avisoDe, prio: 3, txt: () => `${P.nome} morreu, volta em ${seg(e.avisoDe - simT)}s` });
      else if (e.auto) L.push({ chave:"rec"+e.p+e.t, ate: e.t, prio: 4, txt: () => `⚠️ vai recolocar ${P.nome} em ${seg(e.t - simT)}s (${fmt$(P.preco||0)})` });
      else L.push({ chave:"cp"+e.t+e.p, ate: e.t, prio: 3, txt: () => `em ${seg(e.t - simT)}s: compra ${P.nome} (${fmt$(P.preco||0)})` }); }
  }
  if (venc && j !== venc && nx[j].vida / CONFIG.nexusVida < 0.3 && falta > 15) L.push({ chave:"quase", ate: simT + 4, prio: 2, txt: () => "⚠️ seu nexus tá quase caindo!" });
  if (venc && falta > 15) { const ag = empurrao(simT) * (j === venc ? 1 : -1);
    L.push({ chave:"estado"+Math.round(ag), ate: simT + 4, prio: 1, txt: () => ag >= 0.5 ? "⚔️ seu time tá atacando o nexus dele" : ag <= -0.5 ? "🛡️ eles estão no seu nexus!" : "⚖️ briga no meio" }); }
  return L.sort((a, b) => b.prio - a.prio || a.ate - b.ate);
}
function proximaVirada(j){
  const venc = CONFIG.vencedor; if (!venc || CONFIG.duracao - simT <= 15) return null;
  const sinal = j === venc ? 1 : -1, ag = empurrao(simT) * sinal;
  for (let tt = Math.ceil(simT * 4) / 4 + 0.25; tt < Math.min(CONFIG.duracao, simT + 60); tt += 0.25) { const e2 = empurrao(tt) * sinal;
    if (ag < 0.5 && e2 >= 0.5) return { ate: tt, txt: () => `depois → em ${seg(tt - simT)}s: seu time avança até o nexus dele` };
    if (ag > -0.5 && e2 <= -0.5) return { ate: tt, txt: () => `depois → em ${seg(tt - simT)}s: eles avançam até o seu nexus` }; }
  return null;
}
function camTexto(el, j){
  const span = el.querySelector("span"), em = el.querySelector("em"), bar = el.querySelector("i");
  if (fim) { span.textContent = fim === j ? "🏆 VOCÊ VENCEU! comemora" : "💀 você perdeu, reage"; em.textContent = ""; bar.style.width = "0"; return; }
  camTexto.c = camTexto.c || {};
  const cur = camTexto.c[j];
  const cands = candidatosCam(j), top = cands[0];
  // troca só quando o atual terminou (ou se chegou algo mais importante, tipo a contagem final)
  if (!cur || simT >= cur.ate + 0.6 || simT < cur.ini - 1 || (top && top.prio >= 9 && cur.chave !== top.chave)) camTexto.c[j] = top ? { ...top, ini: simT, tam: Math.max(1, top.ate - simT) } : null;
  const at = camTexto.c[j];
  span.textContent = at ? at.txt() : "só assistir";
  // linha "depois": também fica fixa até acontecer
  camTexto.d = camTexto.d || {};
  const dcur = camTexto.d[j];
  if (!dcur || simT >= dcur.ate + 0.5 || simT < dcur.ini - 1) { const nv = proximaVirada(j); camTexto.d[j] = nv ? { ...nv, ini: simT } : null; }
  em.textContent = camTexto.d[j] ? camTexto.d[j].txt() : "";
  // barrinha: enche até o fim do aviso atual
  const f = at ? Math.min(1, Math.max(0, 1 - (at.ate - simT) / Math.min(10, at.tam))) : 0;
  bar.style.width = (f*100) + "%"; bar.style.background = at && at.ate - simT < 3 ? "#ff6a3d" : "#ffe25b";
}

btnVoltar.onclick = () => {
  // limpa o jogo e o meu lugar; o outro continua na tela final até ele mesmo voltar
  if (EU) { NX.naoSair("j"+EU); NX.set("j"+EU, null); }
  NX.set("inicio", null); NX.set("fim", null);
  try { sessionStorage.removeItem("nexus_eu"); } catch (e) {}
  location.reload();
};

/* ===== FIM: nexus explode em pixel art + VENCEU letra por letra ===== */
const easeOut = k => 1 - Math.pow(1 - k, 3);
let PEDACOS = [];
function desenharExplosao(j, ft, t){
  const np = proj(NEXUS[j].x, -0.4), cx = np.x, cy = np.y - 95*SC, tons = TONS[j];
  if (ft < 1.1) {           // carregando: brilho piscando cada vez mais rápido
    const pisca = Math.floor(ft * (6 + ft*20)) % 2;
    if (pisca) { ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fillRect(snap(cx - 24*SC), snap(cy - 40*SC), snap(48*SC), snap(70*SC)); }
    for (let i=0;i<6;i++){ const a = i/6*Math.PI*2 + ft*4, r = (1.1 - ft) * 120*SC;
      ctx.fillStyle = i%2 ? "#fff" : tons[3]; ctx.fillRect(snap(cx + Math.cos(a)*r), snap(cy + Math.sin(a)*r*0.6), PX*2, PX*2); }
    PEDACOS = [];
    return;
  }
  const e = ft - 1.1;
  if (!PEDACOS.length) {    // cria os pedaços do cristal
    for (let i=0;i<70;i++){ const a = Math.random()*Math.PI*2, v = 120 + Math.random()*420;
      PEDACOS.push({ x:0, y:0, vx:Math.cos(a)*v*SC, vy:(Math.sin(a)*v - 200)*SC, s: PX*(1 + Math.floor(Math.random()*3)), cor: [tons[0],tons[1],tons[2],tons[3],"#fff"][i%5], gira: Math.random() }); }
  }
  // clarão branco em quadrados
  if (e < 0.35) { const r = snap((40 + e*900)*SC); ctx.fillStyle = `rgba(255,255,255,${1 - e/0.35})`;
    for (let yy = -r; yy <= r; yy += PX*4) { const w = Math.sqrt(Math.max(0, r*r - yy*yy)); ctx.fillRect(snap(cx - w), snap(cy + yy), snap(w*2), PX*4); } }
  // anéis de choque pixelados
  for (let k=0;k<3;k++){ const ee = e - k*0.12; if (ee < 0 || ee > 0.9) continue; const r = (30 + ee*520)*SC;
    ctx.globalAlpha = 1 - ee/0.9; ctx.fillStyle = k===1 ? tons[2] : "#ffd23f";
    for (let i=0;i<36;i++){ const a = i/36*Math.PI*2; ctx.fillRect(snap(cx + Math.cos(a)*r), snap(cy + Math.sin(a)*r*0.55), PX*3, PX*3); } }
  ctx.globalAlpha = 1;
  // pedaços voando com gravidade
  for (const p of PEDACOS) { const x = cx + p.vx*e, y = cy + p.vy*e + 520*SC*e*e;
    if (y > np.y + 30*SC) continue; ctx.fillStyle = p.cor; ctx.fillRect(snap(x), snap(y), p.s, p.s); }
  // fumaça subindo
  for (let i=0;i<14;i++){ const ee = e - i*0.05; if (ee < 0) continue; const a = i*2.4, r = (20 + ee*60)*SC;
    ctx.globalAlpha = Math.max(0, 0.7 - ee*0.35); ctx.fillStyle = i%2 ? "#2a2a33" : "#45454f";
    const s = snap((10 + ee*30)*SC); ctx.fillRect(snap(cx + Math.cos(a)*r), snap(cy - ee*90*SC + Math.sin(a)*r*0.4), s, s); }
  ctx.globalAlpha = 1;
}
function desenharVitoria(v, ft, t){
  if (ft < 2.2) return;
  const e = ft - 2.2, cor = corDe(v), dados = jog[v];
  // escurece em faixas de pixel
  const esc = Math.min(1, e*2);
  ctx.fillStyle = `rgba(5,8,20,${0.72*esc})`; ctx.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += PX*4) { ctx.fillStyle = `rgba(0,0,0,${0.15*esc})`; ctx.fillRect(0, y, W, PX); }
  // raios girando atrás
  for (let i=0;i<14;i++){ const a = e*0.5 + i*Math.PI/7; ctx.fillStyle = cor + "55";
    for (let r = PX*40; r < Math.max(W,H); r += PX*7) ctx.fillRect(snap(W/2 + Math.cos(a)*r), snap(H*0.4 + Math.sin(a)*r), PX*3, PX*3); }
  // foto do vencedor caindo com quique
  const f1 = Math.min(1, e/0.6), quique = f1 < 1 ? (1 - easeOut(f1)) * -H*0.5 : Math.sin(Math.min(1,(e-0.6)/0.3)*Math.PI)*-PX*6;
  const tam = snap(Math.min(H*0.3, PX*70)), fx = W/2, fy = H*0.36 + quique;
  pbox(fx - tam/2 - PX*4, fy - tam/2 - PX*4, tam + PX*8, tam + PX*8, "#000", cor, "#fff");
  const foto = img(dados.foto);
  if (foto) { ctx.imageSmoothingEnabled = false; ctx.drawImage(foto, snap(fx - tam/2), snap(fy - tam/2), tam, tam); }
  else { ctx.fillStyle = cor; ctx.fillRect(snap(fx - tam/2), snap(fy - tam/2), tam, tam); }
  // coroa pixel em cima
  if (e > 0.7) { const cw = PX*24, cy2 = fy - tam/2 - PX*14 - Math.abs(Math.sin(t*3))*PX*2;
    ctx.fillStyle = "#ffd23f"; ctx.fillRect(snap(fx - cw/2), snap(cy2 + PX*6), cw, PX*6);
    for (const dx of [-cw/2, -PX*2, cw/2 - PX*4]) ctx.fillRect(snap(fx + dx), snap(cy2), PX*4, PX*6);
    ctx.fillStyle = "#ff4f6d"; ctx.fillRect(snap(fx - PX), snap(cy2 + PX*7), PX*2, PX*2); }
  // nome
  if (e > 0.6) { const k = Math.min(1, (e - 0.6)/0.3); ctx.globalAlpha = k;
    ptexto(dados.nome, W/2, fy + tam/2 + PX*18, PX*11, "#fff", "center", "#000", W*0.8); ctx.globalAlpha = 1; }
  // VENCEU! letra por letra caindo grande e assentando
  const palavra = "VENCEU!", tamL = Math.min(PX*22, W/12), y0 = fy + tam/2 + PX*44;
  ctx.font = `${Math.round(tamL)}px ${FONTE}`; const larg = ctx.measureText(palavra).width;
  let x = W/2 - larg/2;
  [...palavra].forEach((ch, i) => {
    const w = ctx.measureText(ch).width, ti = e - 1.0 - i*0.18;
    if (ti > 0) {
      const k = Math.min(1, ti/0.25), escala = 1 + (1 - easeOut(k))*2.5, sobe = (1 - easeOut(k)) * -PX*30;
      const onda = Math.sin(t*5 + i*0.6) * PX*2 * (ti > 0.4 ? 1 : 0);
      ctx.save(); ctx.translate(Math.round(x + w/2), Math.round(y0 + sobe + onda)); ctx.scale(escala, escala);
      ptexto(ch, 0, 0, tamL/0.8, ti < 0.08 ? "#fff" : ["#ffd23f","#ffe14d","#ffd23f"][i%3], "center", "#000");
      ctx.restore();
      if (ti < 0.1) { ctx.fillStyle = "#fff"; for (let q=0;q<6;q++) ctx.fillRect(snap(x + w/2 + (Math.random()-.5)*w*2), snap(y0 - tamL/2 + (Math.random()-.5)*tamL*1.5), PX*2, PX*2); }
    }
    x += w;
  });
  // confete pixel
  if (e > 1.0) { if (!desenharVitoria.conf) desenharVitoria.conf = Array.from({length:140}, () => ({ x:Math.random(), y:-Math.random(), v:0.1+Math.random()*0.25, c:["#2fa8ff","#ff4f6d","#ffd23f","#5dff7a","#fff","#c77dff"][Math.floor(Math.random()*6)] }));
    for (const c of desenharVitoria.conf) { c.y += c.v/60; if (c.y > 1.05) c.y = -0.05;
      ctx.fillStyle = c.c; ctx.fillRect(snap(c.x*W + Math.sin(t*2 + c.x*20)*10), snap(c.y*H), PX*2, PX*(Math.floor(t*6 + c.x*10)%2 ? 3 : 1)); } }
  else desenharVitoria.conf = null;
}

/* ===== loop ===== */
function loop(){
  const t = performance.now()/1000;
  if (!window.ESPECTADOR && lobby.style.display !== "none" && Math.floor(t*2) !== loop.ult) { loop.ult = Math.floor(t*2); atualizaEspera(); }
  if (inicio && EU && !fim) {
    const alvo = (Date.now() - inicio)/1000 * (CONFIG.acelerar || 1);
    if (alvo < simT - 0.5) novaPartida();
    const falta = Math.floor((alvo - simT) / DT);
    FX.on = falta < 6;              // pulando no tempo -> sem efeitos
    let n = 0; while (simT + DT <= alvo && n++ < 900) passo();
    FX.on = true;
  }
  const agora = performance.now()/1000, dtv = Math.min(0.05, agora - (loop.tv || agora)); loop.tv = agora;
  FX.passo(dtv);
  if (fim) { loop.fimT = loop.fimT || agora; } else loop.fimT = 0;
  const ft = fim ? agora - loop.fimT : 0, perd = fim === 1 ? 2 : 1;
  ctx.save();
  if (fim) {   // zoom no nexus que vai explodir
    const z = 1 + 1.1 * easeOut(Math.min(1, ft / 1.1)), np = proj(NEXUS[perd].x, -0.4), foco = { x: np.x, y: np.y - 90*SC };
    const k = easeOut(Math.min(1, ft/1.1)), zz = 1 + (z-1);
    // não deixa o zoom mostrar fora da imagem do cenário
    const tx = Math.min(0, Math.max(W - W*zz, W/2 - foco.x*zz)), ty = Math.min(0, Math.max(H - H*zz, H*0.52 - foco.y*zz));
    ctx.translate(tx, ty); ctx.scale(zz, zz);
    if (ft > 1.1 && ft < 3.2) { const tr = (3.2 - ft) * 6; ctx.translate(snap((Math.random()-.5)*tr), snap((Math.random()-.5)*tr)); }
  }
  if (FX.shake > 0.6) ctx.translate(snap((Math.random()-.5)*FX.shake), snap((Math.random()-.5)*FX.shake));
  desenharCenario(t);
  const ordem = EU === 2 ? [1,2] : [2,1];
  desenharNexus(1, t); desenharNexus(2, t);
  [...unid].sort((a,b) => a.y - b.y).forEach(u => desenharUnidade(u, t));
  desenharTiros(t);
  desenharFumacas();
  desenharFX();
  if (fim) desenharExplosao(perd, ft, t);
  ctx.restore();
  document.body.classList.toggle("jogando", lobby.style.display === "none");
  if (EU && !fim) desenharLoja(t);
  camA.classList.toggle("direita", EU === 2);       // J1 lê na esquerda, J2 na direita
  if (fim) camA.style.display = "none"; else camA.style.display = "";
  if (FX.flashTela > 0) { ctx.fillStyle = `rgba(255,255,255,${FX.flashTela})`; ctx.fillRect(0,0,W,H); }
  if (fim) desenharVitoria(fim, ft, t);
  btnVoltar.style.display = fim && ft > 4.5 && !window.ESPECTADOR ? "block" : "none";
  if (EU) { camTexto(camA, EU); camB.style.display = "none"; }   // cada youtuber só vê o que ELE vai fazer
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ===== teclado (durante o jogo) ===== */
addEventListener("keydown", e => {
  if (lobby.style.display !== "none") return;
  const k = e.key.toLowerCase();
  if (k === "r") NX.set("inicio", Date.now() + 3500);                 // reinicia a partida pros dois
  if (k === "l") { NX.set("inicio", null); NX.set("j1", null); NX.set("j2", null); location.reload(); } // volta pro lobby
});
</script>
